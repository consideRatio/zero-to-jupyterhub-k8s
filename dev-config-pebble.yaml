# Pebble validates HTTP-01 on Traefik's pod HTTP port. CI rewrites Pebble's
# CoreDNS config to resolve local.jovyan.org to the autohttps pod IP after the
# chart has been installed.
#
# ref: https://github.com/jupyterhub/pebble-helm-chart/blob/HEAD/pebble/values.yaml
#
pebble:
  config:
    pebble:
      httpPort: 8080

coredns:
  corefileSegment: |-
    template ANY ANY local.jovyan.org {
      rcode NXDOMAIN
    }
